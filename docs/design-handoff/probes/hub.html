<style>
:root{--bg:#F7F8FA;--card:#fff;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--acc:#2F6BFF}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;display:flex;flex-direction:column}
header{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px 0}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:17px;margin:0 0 6px}
.todo{font-size:13px;color:var(--sub)}
.todo b{color:var(--acc)}
.export{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);border-bottom:0;background:#F3F4F6;color:var(--sub);padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--card)}
.tab.unseen .t::after{content:"NEW";font-size:10px;font-weight:700;color:#fff;background:var(--acc);border-radius:6px;padding:1px 5px;margin-left:6px}
.badge{font-size:11px;font-weight:600;color:var(--sub);background:#E5E7EB;border-radius:999px;padding:2px 8px}
.badge.ok{color:#065F46;background:#D1FAE5}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
<script>/* PIKKU_LOCAL_FEEDBACK */
(function(){
  async function all(){let r=await fetch('/api/feedback',{cache:'no-store'});if(!r.ok)throw Error('read failed');return r.json()}
  function doc(path){if(!/^feedback\/[a-z0-9][a-z0-9-]*$/.test(path))throw Error('invalid path');let key=path.slice(9);return {async get(){let d=await all();return {id:key,exists:Object.hasOwn(d,key),data:()=>d[key]||null}},async set(value){let r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});if(!r.ok)throw Error('save failed')}}}
  let db={doc,collection(path){if(path!=='feedback')throw Error('invalid collection');return {async get(){let d=await all();return {docs:Object.entries(d).map(([id,value])=>({id,exists:true,data:()=>value}))}}}}};
  window.claude={async use(name){return name==='db'?db:null}};
})();
</script></head>

&lt;style&gt;
:root{color-scheme:light only;
  --bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--soft:#EEF0F3;
  --acc:#2F6BFF;--acc-d:#1F4ED8}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 &quot;Pretendard&quot;,-apple-system,&quot;Apple SD Gothic Neo&quot;,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 72px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 4px}
h2 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px}
.sub{color:var(--sub);margin:0 0 24px}
.counter{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:#EEF3FF;border-radius:14px;padding:3px 12px;vertical-align:4px;margin-left:8px}
.fb-warn{font-size:12px;color:var(--sub);background:var(--soft);border-radius:8px;padding:6px 10px;margin-bottom:16px;display:inline-block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

section[data-unit]{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:48px}
.strip{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;width:132px}
.strip .ax{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.strip .ax b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.strip .ax span{overflow:hidden;text-overflow:ellipsis}
.save{font:inherit;font-weight:700;font-size:14px;height:40px;width:132px;padding:0;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.save:focus-visible,.opt:focus-visible,.rowchk:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.strip .saved{font-size:12px;font-weight:600;color:#166534;text-align:center;min-height:18px}
.strip .go{height:auto;min-height:40px;padding:8px 6px;line-height:1.3;white-space:normal}
.strip .alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.strip .alt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.strip .save[hidden]{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:700;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.name{font-weight:700;white-space:nowrap}
td.cta{color:var(--acc);font-weight:600}
td.rm{width:120px;text-align:right}
td.rm label{font-size:12px;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
tr.off td{opacity:.4;text-decoration:line-through}
tr.off td.rm{opacity:1;text-decoration:none}
.fixed{margin-top:14px;font-size:13px;color:var(--sub)}
.fixed b{color:var(--ink)}
.fixed span{display:inline-block;margin:2px 10px 2px 0}

.q{padding:14px 0;border-bottom:1px solid var(--soft)}
.q:last-of-type{border-bottom:0}
.q .qt{font-weight:700;margin-bottom:4px}
.q .why{font-size:12px;color:var(--sub);margin:0 0 10px}
.q .why b{color:#166534}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:14px;font-weight:600;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;position:relative}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.reco::after{content:&quot;추천&quot;;position:absolute;top:-9px;right:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:#166534;color:#fff}
.opt.on.reco::after{background:#22C55E}
.q[data-locked] .opt{pointer-events:none}
.q[data-locked] .opt:not(.on){opacity:.45}

.fb{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.fb .eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;margin-bottom:10px}
textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff;min-height:72px}
textarea::placeholder{color:#9CA3AF}
.overall{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
.overall .fb{margin-top:0}
.foot{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
@media (max-width:900px){section[data-unit],.overall{grid-template-columns:1fr}.strip{position:static;flex-direction:row;flex-wrap:wrap;width:auto;align-items:center}.strip .saved{margin-left:auto}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

function draft(id){
  if(!DRAFT[id]){
    const s=FB[id];
    if(id===&#x27;1&#x27;)DRAFT[id]={marks:s?[...(s.marks||[])]:[],text:s?(s.text===&#x27;추천대로&#x27;?&#x27;&#x27;:s.text||&#x27;&#x27;):&#x27;&#x27;};

  }
  return DRAFT[id];

    document.querySelectorAll(&#x27;.q&#x27;).forEach(q=&gt;{const v=d.answers[q.dataset.q];q.querySelectorAll(&#x27;.opt&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,b.dataset.val===v));});

" hidden></iframe></main>
<script>
const META=[{"key": "reference-wireframe", "title": "화면 미리보기", "prefixes": ["sketch-"], "stage": "이미지 기반 첫 시안"}, {"key": "structure", "title": "구조 확인", "prefixes": ["structure-"], "stage": "1단계 구조"}, {"key": "flow-proposal", "title": "추천 따라가 보기", "prefixes": ["scene-"], "stage": "2단계 플로우"}, {"key": "style-reference", "title": "이미지 디자인 기준", "prefixes": ["style-"], "stage": "3단계 이미지 기준"}, {"key": "rules-preview", "title": "디자인 규칙 미리보기", "prefixes": ["section-"], "stage": "4단계 규칙 검토"}, {"key": "final-preview", "title": "화면별 최종 검토", "prefixes": ["screen-"], "stage": "Figma 제작 전 확인"}];
const tabs=[...document.querySelectorAll('.tab')],panes=[...document.querySelectorAll('.pane')];
let seen={};try{seen=JSON.parse(localStorage.getItem('hub-seen')||'{}')}catch(e){}
function show(key){
  tabs.forEach(t=>t.classList.toggle('on',t.dataset.key===key));
  panes.forEach(p=>p.hidden=p.dataset.key!==key);
  seen[key]=1;try{localStorage.setItem('hub-seen',JSON.stringify(seen))}catch(e){}
  try{location.hash=key}catch(e){}
  paint();
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.key)));
let counts={};
function paint(){
  let unseen=[],empty=[];
  META.forEach(m=>{
    const t=tabs.find(x=>x.dataset.key===m.key);
    t.classList.toggle('unseen',!seen[m.key]);
    const n=m.prefixes.reduce((a,p)=>a+(counts[p]||0),0);const b=document.getElementById('badge-'+m.key);
    b.textContent=n?`저장 ${n}건`:'아직 없음';b.classList.toggle('ok',n>0);
    if(!seen[m.key])unseen.push(m.title);else if(!n)empty.push(m.title);
  });
  const el=document.getElementById('todo');
  if(!unseen.length&&!empty.length)el.innerHTML='모든 탭을 보고 저장했어요 ✓';
  else el.innerHTML=(unseen.length?`아직 안 본 탭: <b>${unseen.join(', ')}</b>`:'')+(unseen.length&&empty.length?' · ':'')+(empty.length?`저장 없는 탭: <b>${empty.join(', ')}</b>`:'');
}
let realDb=null;
let feedbackExportText='';
let exportSeq=0,exportPending={};
const dbReady=(async()=>{try{realDb=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;}catch(e){realDb=null;}})();
window.addEventListener('message',e=>{
  const m=e.data;if(!m||m.__hubexport!==1||!e.source)return;
  if(!panes.some(p=>p.contentWindow===e.source))return;
  const pending=exportPending[m.id];if(!pending)return;
  Object.assign(pending.docs,m.docs||{});pending.remaining-=1;
  if(pending.remaining===0){clearTimeout(pending.timer);delete exportPending[m.id];pending.resolve(pending.docs);}
});
function requestFrameFeedback(){
  return new Promise(resolve=>{
    const frames=panes.filter(p=>p.contentWindow),id=++exportSeq;
    if(!frames.length){resolve({});return;}
    const pending={docs:{},remaining:frames.length,resolve,timer:null};exportPending[id]=pending;
    pending.timer=setTimeout(()=>{if(!exportPending[id])return;delete exportPending[id];resolve(pending.docs);},1200);
    frames.forEach(p=>p.contentWindow.postMessage({__hubexport:1,id},'*'));
  });
}
function applyFrameFeedback(docs){
  let exported={};try{exported=JSON.parse(feedbackExportText||'{}')}catch(e){}
  Object.assign(exported,docs||{});feedbackExportText=JSON.stringify(exported,null,2);
  Object.entries(exported).forEach(([id,dd])=>META.forEach(x=>x.prefixes.forEach(p=>{if(id.startsWith(p)&&(id===p||!/\d/.test(p.slice(-1))||id.length===p.length))counts[p]=1;})));
  paint();
}
async function loadFrameFeedback(){applyFrameFeedback(await requestFrameFeedback());}
window.addEventListener('message',async e=>{
  const m=e.data;if(!m||m.__hubdb!==1||!e.source)return;
  if(!panes.some(p=>p.contentWindow===e.source))return;
  const reply=(result,error)=>{try{e.source.postMessage({__hubdb:1,id:m.id,result,error},'*');}catch(x){}};
  try{
    await dbReady;
    if(m.op==='avail')return reply(!!realDb);
    if(!realDb)throw {code:'not_granted',message:'db unavailable'};
    if(m.op==='get'){const s=await realDb.doc(m.path).get();return reply({id:s.id,exists:s.exists,data:s.data()});}
    if(m.op==='set'){await realDb.doc(m.path).set(m.data);loadCounts();return reply(true);}
    if(m.op==='update'){await realDb.doc(m.path).update(m.data);loadCounts();return reply(true);}
    if(m.op==='delete'){await realDb.doc(m.path).delete();loadCounts();return reply(true);}
    if(m.op==='list'){const q=await realDb.collection(m.path).get();return reply(q.docs.map(d=>({id:d.id,exists:d.exists,data:d.data()})));}
    throw {code:'invalid_argument',message:'unknown op'};
  }catch(err){reply(null,{code:(err&&err.code)||'unavailable',message:(err&&err.message)||String(err)});}
});
async function loadCounts(){
  try{
    await dbReady;const db=realDb;
    if(!db)return;
    const snap=await db.collection('feedback').get();
    counts={};const exported={};
    snap.docs.forEach(d=>{const id=d.id;const dd=d.data()||{};if(/^(app-|axis-)/.test(id))exported[id]=dd;const has=(dd.reaction||dd.best||dd.worst||(dd.marks&&dd.marks.length)||(dd.want&&dd.want.length)||(dd.dislike&&dd.dislike.length)||dd.answers||dd.choices||(dd.text&&dd.text.trim()));if(!has)return;META.forEach(x=>x.prefixes.forEach(p=>{if(id.startsWith(p)&&(id===p||!/\d/.test(p.slice(-1))||id.length===p.length))counts[p]=(counts[p]||0)+1;}));});
    feedbackExportText=JSON.stringify(exported,null,2);
    paint();
  }catch(e){}
}
const exportFeedback=document.getElementById('export-feedback');
if(exportFeedback)exportFeedback.addEventListener('click',async()=>{
  const el=document.getElementById('todo');
  await loadFrameFeedback();
  if(!feedbackExportText||feedbackExportText==='{}'){el.textContent='저장된 3단계 의견을 아직 불러오지 못했어요';return;}
  navigator.clipboard.writeText(feedbackExportText)
    .then(()=>{el.textContent='저장 의견을 복사했어요 — Codex 채팅에 붙여 넣어 주세요';})
    .catch(()=>{el.textContent='복사가 차단됐어요 — 브라우저 권한을 확인해 주세요';});
});
const first=(location.hash||'').slice(1);
show(META.some(m=>m.key===first)?first:META[0].key);
loadCounts();setTimeout(loadFrameFeedback,500);setInterval(()=>{loadCounts();loadFrameFeedback();},20000);
</script>
